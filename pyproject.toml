[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "asset-archaeologist"
version = "0.1.0"
description = "Enable agents to find human art you already own: renders, indexes and searches the 3D models in your asset packs, locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Neet (CrossBread)" }]
requires-python = ">=3.11"
keywords = ["3d", "assets", "game-development", "blender", "siglip", "search", "ai-agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.1",
  "torch>=2.1",
  "torchvision>=0.16",
  "open_clip_torch>=2.24",
  "timm>=0.9.8",
  "huggingface_hub>=0.20",
  "transformers>=4.40",
  "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
asset-archaeologist = "asset_archaeologist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_archaeologist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
